[package]
name = "diskwise"
default-run = "diskwise"
version = "0.1.0"
description = "Diskwise — local-first disk space analyzer for Windows"
authors = ["Diskwise"]
edition = "2021"
rust-version = "1.99"

[lib]
name = "diskwise_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local database (settings, scan history, Pro entitlement).
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTPS calls to Dodo Payments' public license endpoints (Pro activation
# and validation). Already in the dependency tree via Tauri; declared here
# because the licensing module calls it directly. No API key is ever held.
reqwest = { version = "0.13", features = ["json"] }

# Cryptographic hashing for duplicate detection.
sha2 = "0.10"
libc = "0.2"


# Parallel directory walking and hashing.
rayon = "1"


thiserror = "1"

[features]
# Default = no custom features; everything ships in the binary.
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
