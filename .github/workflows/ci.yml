name: Windows build
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Native tests
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          cmd /c "npm run rust:test -- --target x86_64-pc-windows-msvc > native.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content native.log
          if ($code -ne 0) {
            $message = (((Get-Content native.log | Select-String -Pattern '^error|^failures:|FAILED|panicked at|test result:' -Context 0,5 | ForEach-Object { $_.ToString() }) -join "`n") | ForEach-Object { $_.Substring([Math]::Max(0, $_.Length - 6000)) }).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native diagnostics::$message"
            exit $code
          }
      - run: npm test
      - name: Package
        shell: pwsh
        run: |
          cmd /c "npm run app:build > package.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content package.log
          if ($code -ne 0) {
            $message = ((Get-Content package.log -Tail 40) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Packaging diagnostics::$message"
            exit $code
          }
      - name: Check executable runtime imports
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $tools = (Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $imports = & "$tools\bin\Hostx64\x64\dumpbin.exe" /dependents release/Diskora.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect PE runtime dependencies' }
          $imports
          if ($imports -match '(?i)(VCRUNTIME|MSVCP|sqlite3|WebView2Loader).*\.dll') { throw 'Unexpected external runtime DLL dependency' }
      - name: Test the actual desktop UI with real files
        run: node scripts/smoke-windows.mjs
      - name: Install, run and uninstall the Windows package
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'Diskora installed test'
          $installer = Start-Process (Resolve-Path release/Diskora-setup.exe) -ArgumentList "/S /D=$directory" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          if (!(Test-Path "$directory/Diskora.exe")) { throw 'Installed executable is missing' }
          node scripts/smoke-windows.mjs "$directory/Diskora.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
          $uninstaller = Start-Process "$directory/uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstaller.ExitCode)" }
          if (Test-Path "$directory/Diskora.exe") { throw 'Uninstaller left the executable behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: Diskora-Windows-x64
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: ignore
      # Session-only delivery: the authoring sandbox cannot reach
      # Actions artifact storage, so verified binaries are committed
      # back to the working branch once every check above passed.
      # The checksum file is regenerated so it always matches the
      # delivered binaries, and the step is a no-op when nothing
      # changed (repeat runs must not fail here).
      - name: Deliver verified binaries to the session branch
        if: github.ref == 'refs/heads/arena/3f9b31fa-meowchan'
        shell: pwsh
        run: |
          git config user.name "Diskora build"
          git config user.email "diskora-build@users.noreply.github.com"
          $setupHash = (Get-FileHash release\Diskora-setup.exe -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash release\Diskora.exe -Algorithm SHA256).Hash.ToLower()
          $sums = [string[]]@(
            "$setupHash  Diskora-setup.exe"
            "$exeHash  Diskora.exe"
          )
          Set-Content -Path release\SHA256SUMS.txt -Value $sums -Encoding ascii
          $checksumLines = Get-Content release\SHA256SUMS.txt
          if ($checksumLines.Count -ne 2 -or
              $checksumLines[0] -ne "$setupHash  Diskora-setup.exe" -or
              $checksumLines[1] -ne "$exeHash  Diskora.exe") {
            throw 'SHA256SUMS.txt must contain one correct SHA-256 line per binary.'
          }
          git add src-tauri/Cargo.lock
          git add -f release/Diskora.exe release/Diskora-setup.exe release/SHA256SUMS.txt
          if (git diff --cached --quiet) {
            Write-Output "No verified binary changes to deliver."
          } else {
            git commit -m "Deliver Windows build and dependency lock [skip ci]"
            git push origin HEAD:arena/3f9b31fa-meowchan
          }
